<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --primary: #2563eb;
            --income: #16a34a;
            --expense: #dc2626;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 2rem; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { margin-top: 0; }

        .alert { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-weight: 500; }
        .alert.success { background: #dcfce7; color: #166534; }
        .alert.warning { background: #fef3c7; color: #92400e; }
        .alert.error { background: #fee2e2; color: #991b1b; }

        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
        .card { background: var(--card); padding: 1.25rem; border-radius: 10px; border: 1px solid var(--border); }
        .card h3 { margin: 0 0 0.5rem; font-size: 0.9rem; color: var(--muted); text-transform: uppercase; }
        .card .value { font-size: 1.75rem; font-weight: 700; }
        .income { color: var(--income); }
        .expense { color: var(--expense); }

        .forms-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        form { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        input, select, button {
            padding: 0.6rem 0.75rem; border: 1px solid var(--border);
            border-radius: 6px; font-size: 0.95rem;
        }
        input, select { flex: 1 1 140px; }
        button { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: 600; }
        button:hover { opacity: 0.92; }

        .bar-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.6rem; }
        .bar-label { width: 130px; font-weight: 600; }
        .bar-track { flex: 1; background: #e2e8f0; height: 18px; border-radius: 99px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary); border-radius: 99px; }
        .bar-amount { width: 90px; text-align: right; font-variant-numeric: tabular-nums; }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; }
        .badge { padding: 0.2rem 0.55rem; border-radius: 99px; font-size: 0.8rem; font-weight: 600; }
        .badge.income { background: #dcfce7; color: var(--income); }
        .badge.expense { background: #fee2e2; color: var(--expense); }
    </style>
</head>
<body>
<div class="container">
    <h1>Personal Finance Tracker</h1>

    {{ALERT}}

    <div class="summary-grid">
        <div class="card">
            <h3>Total Income</h3>
            <div class="value income">${{INCOME}}</div>
        </div>
        <div class="card">
            <h3>Total Expenses</h3>
            <div class="value expense">${{EXPENSE}}</div>
        </div>
        <div class="card">
            <h3>Net Balance</h3>
            <div class="value">${{BALANCE}}</div>
        </div>
    </div>

    <div class="forms-grid">
        <div class="card">
            <h3>Add Transaction</h3>
            <form action="/add" method="POST">
                <select name="type" required>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>
                <input type="text" name="category" placeholder="Category (e.g. Groceries)" required>
                <input type="number" step="0.01" name="amount" placeholder="Amount" required>
                <input type="text" name="description" placeholder="Description">
                <input type="date" name="date">
                <button type="submit">Add</button>
            </form>
        </div>

        <div class="card">
            <h3>Set Monthly Budget</h3>
            <form action="/budget" method="POST">
                <input type="text" name="category" placeholder="Category" required>
                <input type="number" step="0.01" name="limit" placeholder="Limit ($)" required>
                <button type="submit">Save</button>
            </form>
        </div>
    </div>

    <div class="card" style="margin-bottom: 1.5rem;">
        <h3>Expense Breakdown by Category</h3>
        {{CHART_ROWS}}
    </div>

    <div class="card">
        <h3>Transactions</h3>
        <form method="GET" action="/">
            <input type="text" name="keyword" placeholder="Search description...">
            <select name="type">
                <option value="">All Types</option>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
            <input type="text" name="category" placeholder="Category">
            <button type="submit">Filter</button>
            <a href="/" style="padding: 0.6rem; color: var(--muted); text-decoration: none;">Reset</a>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th style="text-align: right;">Amount</th>
                </tr>
            </thead>
            <tbody>
                {{TRANSACTION_ROWS}}
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
